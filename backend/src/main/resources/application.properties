spring.application.name=transitiq-smartbus
server.port=8080

# ---- MySQL (override with env vars DB_USER / DB_PASSWORD) ----
spring.datasource.url=jdbc:mysql://localhost:3306/smartbus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username="${DB_USER:root}"
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA: Hibernate creates the tables, then seed_routes.sql fills them ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=optional:file:../database/seed_routes.sql,optional:file:database/seed_routes.sql

# ---- TransitIQ settings ----
# How many times faster than real time the GPS simulator moves buses
smartbus.sim.speed-multiplier=8
smartbus.cors.allowed-origins=http://localhost:5173
smartbus.admin-invite-code=TRANSITIQ-ADMIN
